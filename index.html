<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 2</title>
    <!-- PyScript JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <!-- PyScript CSS -->
    <link href="https://pyscript.net/releases/2024.1.1/core.css" rel="stylesheet" />

    <!-- Internal CSS -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #1e293b;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Form Card */
        form {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        input[type="button"] {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        input[type="button"]:hover {
            background-color: #1d4ed8;
        }

        input[type="button"]:active {
            transform: scale(0.98);
        }

        /* Members List Display Card */
        body > div {
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e2e8f0;
        }

        h3 {
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        #confirmed_set {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #member_list_display p,
        #total_count_display p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #475569;
        }

        #member_list_display b,
        #total_count_display b {
            color: #1e293b;
        }

        #total_count_display {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1>Add new member</h1>
    <form>
        <input type="text" id="first_name" placeholder="Enter First Name"><br>
        <input type="text" id="last_name" placeholder="Enter Last Name"><br>
        <input type="button" py-click="add_member" value="Add Member">
    </form>
    <div>
        <h3>Members List</h3>
        <div id="confirmed_set">
            <div id="member_list_display"></div>
            <div id="total_count_display"></div>
        </div>
    </div>
    <div id="output"></div>
    <script type="py" src="main.py"></script>
</body>
</html>
